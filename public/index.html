<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中文口语陪练</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="coach-panel" aria-label="中文口语陪练">
        <header class="topbar">
          <div class="coach-title">
            <img class="coach-photo" src="/coach-avatar.png" alt="苏棠头像" />
            <div>
              <p class="eyebrow">Chinese Speaking Coach</p>
              <h1>苏棠 · 中文口语陪练</h1>
            </div>
          </div>
          <div class="status-pill" id="aiStatus">检查中</div>
        </header>

        <section class="settings" aria-label="练习设置">
          <label>
            难度
            <select id="level">
              <option value="beginner">初级</option>
              <option value="intermediate">中级</option>
              <option value="advanced">高级</option>
            </select>
          </label>
          <label>
            语速
            <input id="speed" type="range" min="0.75" max="1.25" step="0.05" value="0.95" />
          </label>
          <label class="toggle">
            <input id="showPinyin" type="checkbox" checked />
            拼音 / 音标
          </label>
          <label class="toggle">
            <input id="showExplanation" type="checkbox" checked />
            英文解释
          </label>
        </section>

        <section class="conversation" id="conversation" aria-live="polite"></section>

        <section class="composer" aria-label="输入区">
          <textarea id="textInput" rows="2" placeholder="用英语说一句话，或点击麦克风开始录音"></textarea>
          <div class="actions">
            <button class="icon-button secondary" id="recordButton" type="button" title="录音" aria-label="录音">
              <span class="mic-mark" aria-hidden="true"></span>
            </button>
            <button class="primary-button" id="sendButton" type="button">发送</button>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
